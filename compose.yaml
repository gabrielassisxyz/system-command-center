services:
  hardware-usage:
    build:
      context: .
    image: hardware-usage:local
    network_mode: host
    pid: host
    user: "0:0"
    read_only: true
    restart: unless-stopped
    environment:
      HW_ADDR: 127.0.0.1:8787
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /sys:/sys:ro
    cap_add:
      - DAC_READ_SEARCH
      - KILL
      - SYS_PTRACE
