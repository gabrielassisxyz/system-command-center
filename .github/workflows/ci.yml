name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # bin/ci runs the prose gate, which resolves a merge base to find the
          # lines this branch adds. A shallow clone has no base commit to reach.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: install lint + vuln tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: bin/ci
        env:
          # Empty on a push, where the fallback (origin/main) is the right base anyway.
          SLOP_GUARD_BASE: ${{ github.event.pull_request.base.sha }}
        run: ./bin/ci
